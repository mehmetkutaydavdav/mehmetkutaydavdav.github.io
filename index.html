<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kutay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ortak/tema.css">
<style>
.hero{padding:96px 22px 74px;max-width:1080px;margin:0 auto}
.hero h1{
  font-family:"Instrument Serif",serif;font-weight:400;
  font-size:clamp(44px,7vw,84px);line-height:.98;margin:18px 0 26px;letter-spacing:-.01em;
}
.hero h1 em{font-style:normal;color:var(--hydro)}
.hero p{font-size:17px;line-height:1.65;color:#C4CFCB;max-width:44ch;margin:0}
.band{max-width:1080px;margin:0 auto;padding:0 22px 78px}
.band h2{
  font-family:"Instrument Serif",serif;font-weight:400;font-size:29px;
  margin:0 0 6px;padding-top:46px;border-top:1px solid var(--line);
}
.band > p{color:var(--muted);margin:0 0 26px;line-height:1.6;max-width:52ch;font-size:14px}
footer{max-width:1080px;margin:0 auto}
#bolum-grid,#arac-grid{margin:0}
</style>
</head>
<body>

<header class="topbar">
  <a class="wordmark" href="index.html" id="wordmark">Atlas</a>
  <nav class="mono">
    <a href="#bolumler">Bölümler</a>
    <a href="#araclar">Araçlar</a>
  </nav>
</header>

<section class="hero">
  <p class="mono" id="etiket">Kişisel site</p>
  <h1 id="baslik">—</h1>
  <p id="tanim"></p>
</section>

<section class="band" id="bolumler">
  <h2>Bölümler</h2>
  <p>Hobilerimden çıkan şeyler.</p>
  <div class="grid" id="bolum-grid"></div>
</section>

<section class="band" id="araclar">
  <h2>Araçlar</h2>
  <p>Kendim için yazdım ama kimseye ait değiller — aç, kendi işin için kullan. Hepsi tarayıcıda çalışıyor, kaydolmak gerekmiyor, dosyaların bilgisayarından çıkmıyor.</p>
  <div class="grid" id="arac-grid"></div>
</section>

<footer>
  <span class="mono" id="altyazi"></span>
  <span class="mono">Harita verileri: OpenStreetMap</span>
</footer>

<script src="ortak/ayarlar.js"></script>
<script>

/* ---------- eksik dosya uyarısı ---------- */
(function(){
  const temaVar = getComputedStyle(document.documentElement).getPropertyValue('--void').trim() !== '';
  const ayarVar = typeof site !== 'undefined';
  if(temaVar && ayarVar) return;

  const eksik = [];
  if(!temaVar) eksik.push('/ortak/tema.css');
  if(!ayarVar) eksik.push('/ortak/ayarlar.js');

  const kutu = document.createElement('div');
  kutu.setAttribute('style',
    'position:fixed;left:0;right:0;top:0;z-index:9999;background:#2A1206;color:#F6E8D8;'+
    'border-bottom:2px solid #C9A227;padding:16px 20px;font:14px/1.6 system-ui,sans-serif');
  kutu.innerHTML =
    '<strong style="display:block;margin-bottom:6px">Şu dosyalar yüklenemedi: ' + eksik.join(' ve ') + '</strong>' +
    'Bu sayfanın bulunduğu klasörde <b>ortak</b> adlı bir klasör olmalı, içinde <b>tema.css</b> ve ' +
    '<b>ayarlar.js</b>. Zip\u2019i çıkarırken klasör eksik kalmış ya da sayfa yanlış yerden açılmış olabilir. ' +
    'Adres çubuğundaki yola bak: <code>' + location.pathname + '</code>';
  document.body.appendChild(kutu);
  document.body.style.paddingTop = '96px';
})();

const S = typeof site === 'undefined' ? {ad:'Atlas'} : site;
const tamAd = [S.ad, S.ikinciAd].filter(Boolean).join(' ');
document.title = tamAd;
document.getElementById('wordmark').innerHTML = S.ad + (S.ikinciAd ? ' <em>' + S.ikinciAd + '</em>' : '');
document.getElementById('baslik').innerHTML = S.ad + (S.ikinciAd ? '<br><em>' + S.ikinciAd + '</em>' : '');
document.getElementById('tanim').textContent = S.tanim || '';
document.getElementById('altyazi').textContent = [tamAd, new Date().getFullYear(), S.altYazi].filter(Boolean).join(' · ');

function kartlar(liste, hedef){
  const el = document.getElementById(hedef);
  el.innerHTML = (liste || []).map(k => {
    const govde = `
      <p class="mono tag">${k.etiket || ''}</p>
      <h3>${k.ad}${k.yol ? ' <span class="arrow">→</span>' : ''}</h3>
      <p>${k.not || ''}</p>`;
    return k.yol
      ? `<a class="cell" href="${k.yol}">${govde}</a>`
      : `<article class="cell is-soon">${govde}</article>`;
  }).join('');
}
kartlar(typeof bolumler === 'undefined' ? [] : bolumler, 'bolum-grid');
kartlar(typeof araclar === 'undefined' ? [] : araclar, 'arac-grid');
</script>
</body>
</html>
